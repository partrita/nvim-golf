name: Common Setup

on:
  workflow_call:
    inputs:
      do_deploy:
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install VHS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo snap install ttyd --classic || sudo apt-get install -y ttyd
          go install github.com/charmbracelet/vhs@v0.9
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Neovim
        run: nvim --version

      - run: cargo check --manifest-path scripts/Cargo.toml
      - run: cargo fmt --manifest-path scripts/Cargo.toml --check
      - run: cargo clippy --manifest-path scripts/Cargo.toml --workspace --all-targets -- -D warnings
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --manifest-path scripts/Cargo.toml

      - run: cargo generate-demos

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.50"

      - run: mdbook build

      - name: Copy generated files
        if: ${{ inputs.do_deploy }}
        run: cp -r ./src/generated ./book

      - name: Deploy to GitHub Pages (gh-pages branch)
        if: ${{ inputs.do_deploy }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          publish_branch: gh-pages

      - name: Upload Pages Artifact
        if: ${{ inputs.do_deploy }}
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

      - name: Deploy to GitHub Pages (native Actions)
        if: ${{ inputs.do_deploy }}
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
